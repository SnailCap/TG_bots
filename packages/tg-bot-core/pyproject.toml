[project]
name = "tg-bot-core"
version = "3.0.0"
description = "Reusable runtime for Telegram bots"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiosqlite>=0.20,<1",
    "jinja2>=3.1,<4",
    "python-telegram-bot>=22,<23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.25,<1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
tg_bot_core = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tg_bot_core*"]
